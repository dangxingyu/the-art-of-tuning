<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1693 929" role="img" aria-labelledby="title desc">
  <title id="title">Clay tuning workbench</title>
  <desc id="desc">A clay-style tuning workbench with coordinate axes, recipe cards, candidate blocks, dials, and a ledger.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#f7e4c5"/>
      <stop offset="1" stop-color="#edc999"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#ead9bc"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0a0a0a" flood-opacity="0.18"/>
    </filter>
    <filter id="clayNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <symbol id="cube" viewBox="0 0 120 120">
      <path d="M18 38c0-16 16-30 38-30h12c23 0 36 11 36 29v45c0 18-15 31-38 31H52c-21 0-34-12-34-30V38Z" filter="url(#clayNoise)"/>
      <path d="M26 36c8 10 25 17 47 15 12-1 22-5 29-11" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="7" stroke-linecap="round"/>
      <path d="M28 89c14 10 44 14 66-2" fill="none" stroke="#0a0a0a" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round"/>
    </symbol>
  </defs>

